# Conference News and Updates
news_items:
  - date: "October 27, 2026"
    title: "Thank you for VLSI-SoC 2026!"
    content: "VLSI-SoC 2026 in Limassol, Cyprus, has come to an end. Thank you to all authors, speakers, and participants! The <a href=\"/2026/\">VLSI-SoC 2026 website</a> remains available in the archive. Details about VLSI-SoC 2027 will be announced soon."
